<div th:fragment="projectContent">

    <!-- 화면 제목 -->
    <div class="row">
        <div class="col-md-12">
            <h2>プロジェクト募集検索</h2>
            <p>条件を入力して、募集中のプロジェクトを検索できます。</p>
        </div>
    </div>

    <br>

    <!-- 검색 조건 -->
    <div class="row">
        <div class="col-md-12">

            <div class="panel panel-default">

                <div class="panel-heading">
                    <h3 class="panel-title">検索条件</h3>
                </div>

                <div class="panel-body">

                    <form action="#" method="get">

                        <div class="row">

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>プロジェクト名</label>
                                    <input type="text" class="form-control" name="projectName" placeholder="プロジェクト名を入力">
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>募集職種</label>
                                    <select class="form-control" name="jobType">
                                        <option value="">選択してください</option>
                                        <option value="frontend">フロントエンド</option>
                                        <option value="backend">バックエンド</option>
                                        <option value="network">ネットワーク</option>
                                        <option value="data">データ</option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>必要経歴</label>
                                    <select class="form-control" name="career">
                                        <option value="">選択してください</option>
                                        <option value="none">未経験可能</option>
                                        <option value="one">1年以上</option>
                                        <option value="three">3年以上</option>
                                        <option value="five">5年以上</option>
                                    </select>
                                </div>
                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>状態</label>
                                    <select class="form-control" name="status">
                                        <option value="">選択してください</option>
                                        <option value="open">募集中</option>
                                        <option value="closed">募集終了</option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>募集人数</label>
                                    <select class="form-control" name="recruitCount">
                                        <option value="">選択してください</option>
                                        <option value="1">1名</option>
                                        <option value="2">2名</option>
                                        <option value="3">3名以上</option>
                                    </select>
                                </div>
                            </div>

                        </div>

                        <hr>

                        <div class="row">

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>カテゴリ</label>
                                    <select class="form-control" name="skillCategory">
                                        <option value="">選択してください</option>
                                        <option value="frontend">フロントエンド</option>
                                        <option value="backend">バックエンド</option>
                                        <option value="network">ネットワーク</option>
                                        <option value="data">データ</option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-md-8">
                                <label>技術スタック</label>
                                <div>
                                    <label class="checkbox-inline">
                                        <input type="checkbox" name="skills" value="Java"> Java
                                    </label>

                                    <label class="checkbox-inline">
                                        <input type="checkbox" name="skills" value="Python"> Python
                                    </label>

                                    <label class="checkbox-inline">
                                        <input type="checkbox" name="skills" value="Spring"> Spring
                                    </label>

                                    <label class="checkbox-inline">
                                        <input type="checkbox" name="skills" value="HTML/CSS"> HTML/CSS
                                    </label>

                                    <label class="checkbox-inline">
                                        <input type="checkbox" name="skills" value="JavaScript"> JavaScript
                                    </label>
                                </div>
                            </div>

                        </div>

                        <div class="text-right">
                            <button type="submit" class="btn btn-primary">検索</button>
                            <button type="reset" class="btn btn-default">リセット</button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

    <!-- 검색 결과 -->
    <div class="row">
        <div class="col-md-12">

            <div class="panel panel-default">

                <div class="panel-heading">
                    <h3 class="panel-title">検索結果一覧</h3>
                </div>

                <div class="panel-body">

                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>プロジェクト名</th>
                                <th>募集職種</th>
                                <th>必要経歴</th>
                                <th>給与</th>
                                <th>状態</th>
                                <th>募集人数</th>
                                <th>募集技術</th>
                                <th class="text-center">詳細</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td>ECサイト開発プロジェクト</td>
                                <td>バックエンド</td>
                                <td>1年以上</td>
                                <td>300,000円 / 月</td>
                                <td><span class="label label-success">募集中</span></td>
                                <td>2名</td>
                                <td>Java / Spring</td>
                                <td class="text-center">
                                    <a href="#" class="btn btn-info btn-sm">詳細</a>
                                </td>
                            </tr>

                            <tr>
                                <td>予約管理システム開発</td>
                                <td>フロントエンド</td>
                                <td>未経験可能</td>
                                <td>250,000円 / 月</td>
                                <td><span class="label label-success">募集中</span></td>
                                <td>1名</td>
                                <td>HTML/CSS / JavaScript</td>
                                <td class="text-center">
                                    <a href="#" class="btn btn-info btn-sm">詳細</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="text-right">
                        <a href="#" class="btn btn-primary">募集登録</a>
                    </div>

                </div>
            </div>

        </div>
    </div>

</div>
