	<style>
	    /* 검색바 전체 레이아웃 (독립된 행에서 중앙 정렬) */
	    .dev_search_zone {
	        max-width:900px;
	        margin: 10px auto 20px auto; /* 중앙 배치 및 아래 조건들과의 여백(30px) */
	        text-align: center;
	    }
	    
	    /* 프로젝트명 라벨 스타일 */
	    .dev_search_label {
	        display: block;
	        font-size: 16px;
	        font-weight: 600;
	        margin-bottom: 10px;
	    }

	    /* 입력창과 버튼을 가로로 정렬해주는 그룹 */
	    .dev_search_group {
	        display: table;
	        width: 100%;
	    }

	    /* 입력창 커스텀 (Klorofil 기본 .form-control 스타일 확장) */
	    .dev_search_input {
	        display: table-cell;
	        width: 100%;
	        height: 46px;
	        padding: 10px 15px;
	        font-size: 15px;
	        background-color: #fcfcfc;
	        border: 1px solid #676a6d;
	        border-radius: 3px 0 0 3px !important; /* 왼쪽만 라운딩 */
	    }
	    
	    .dev_search_input:focus {
	        background-color: #fff;
	        border-color: #eaeaea;
	        outline: none;
	    }

	    /* 우측 버튼 감싸는 영역 */
	    .dev_search_btn_wrap {
	        display: table-cell;
	        vertical-align: middle;
	        width: 1%;
	        white-space: nowrap;
	    }

	    /* 오른쪽 끝 검색 버튼 (Klorofil 테마 컬러 매칭) */
	    .dev_search_btn {
	        height: 46px;
	        padding: 0 25px;
	        font-size: 15px;
	        color: #fff;
	        background-color: #676a6d;
	        border: 1px solid #676a6d;
	        border-radius: 0 3px 3px 0 !important; /* 오른쪽만 라운딩 */
	        cursor: pointer;
	    }
	    
	    .dev_search_btn:hover {
	        background-color: rgb(71, 72, 73)
	    }
		.member_type{
			margin-left:200px;
		}
		
		
		.skill input[type="checkbox"] {
		    display: none; 
		}
		
		.skill span {

		    display: inline-block;
		    padding: 10px 30px;
		    background-color: #eaeaea;
		    color: #676a6d;
		    border-radius: 30px;
		    transition: all 0.2s ease;
			margin-bottom: 10px;
		}
		.skill:hover span {

		    color: #fff;
		}
		.skill input[type="checkbox"]:checked + span {
		    background-color: #676a6d;
		    color: #ffffff;           
		    font-weight: bold;
		}
	</style>

						            <div style="width:500px;  align-items: center; gap: 15px;">
										
						                <input type="range" id="salaryRange" name="salaryRange" 
						                       min="100000" max="1000000" step="10000" value="300000" 
						                       style="margin-top:10px;flex: 1; height: 8px; cursor: pointer;">
										
						                <div style="margin-top:15px;width: 150px; display: flex; align-items: center;">
						                    <input type="text" id="salaryDisplay" class="form-control" 
						                           style="text-align: right; font-weight: bold; background-color: #fff;" readonly>
						                    <span style="margin-left: 5px; font-weight: 600;">円</span>
											
						                </div>
										
						            </div>
				
								</div>
								<label style="font-size: 14px;">
										<input type="radio" name="salaryType" value="" >
											<span style="vertical-align: middle; margin-left: 3px;">協議の上決定</span>
								</label>
						    </div>

						<script>
						    document.addEventListener("DOMContentLoaded", function() {
						        const salaryRange = document.getElementById('salaryRange');
						        const salaryDisplay = document.getElementById('salaryDisplay');
						        const currencyUnit = document.getElementById('currencyUnit');
						        const salaryRadios = document.querySelectorAll('input[name="salaryType"]');

						        // 숫자에 3자리마다 콤마(,)를 찍어주는 함수
						        function formatNumber(num) {
						            return Number(num).toLocaleString();
						        }

						        // 슬라이더 값이 변경될 때마다 박스에 출력하는 함수
						        function updateSalary() {
						            salaryDisplay.value = formatNumber(salaryRange.value);
						        }

						        // 라디오 버튼 상태에 따라 UI를 활성화/비활성화 하는 함수
						        function handleSalaryTypeChange() {
						            const selectedType = document.querySelector('input[name="salaryType"]:checked').value;

						            if (selectedType === 'negotiable') {
						                // '협의 후 결정' 선택 시
						                salaryRange.disabled = true;
						                salaryDisplay.disabled = true;
						                salaryDisplay.value = "협의 후 결정"; // 박스에 텍스트 표시
						                salaryDisplay.style.textAlign = "center";
						                salaryDisplay.style.backgroundColor = "#eee"; // 비활성화 느낌의 배경색
						                currencyUnit.style.opacity = "0.5";           // 단위 흐리게
						            } else {
						                // '금액 지정' 선택 시 (원래대로 복구)
						                salaryRange.disabled = false;
						                salaryDisplay.disabled = false;
						                salaryDisplay.style.textAlign = "right";
						                salaryDisplay.style.backgroundColor = "#fff";
						                currencyUnit.style.opacity = "1";
						                updateSalary(); // 현재 슬라이더 값으로 재설정
						            }
						        }

						        // 초기값 설정
						        updateSalary();

						        // 이벤트 리스너 등록
						        salaryRange.addEventListener('input', updateSalary);
						        
						        salaryRadios.forEach(radio => {
						            radio.addEventListener('change', handleSalaryTypeChange);
						        });
						    });
						</script>
