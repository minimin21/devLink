<!doctype html>
<html lang="jp" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>DevLink</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="/vendor/linearicons/style.css">
    <link rel="stylesheet" href="/vendor/chartist/css/chartist-custom.css">
    <link rel="stylesheet" href="/css/main.css">
    <link th:if="${pageCss == 'personal-register'}" rel="stylesheet" th:href="@{/css/personal-register.css}">
    
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="76x76" href="/img/apple-icon.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/img/favicon.png">
</head>

<body>

  <div id="wrapper">

    <div th:replace="~{common/header :: header}"></div>
    <div th:replace="~{common/sidebar :: sidebar}"></div>

    <div class="main">
      <div class="main-content">
        <div class="container-fluid">
          <div th:replace="~{__${content}__}"></div>
        </div>
      </div>

      <div th:replace="~{common/footer :: footer}"></div>
    </div>

  </div>

  <div th:replace="~{common/login-modal :: loginModal}"></div>
  
  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/vendor/bootstrap/js/bootstrap.min.js"></script>
  <script src="/vendor/jquery-slimscroll/jquery.slimscroll.min.js"></script>
  <script src="/vendor/jquery.easy-pie-chart/jquery.easypiechart.min.js"></script>
  <script src="/vendor/chartist/js/chartist.min.js"></script>
  <script src="/js/klorofil-common.js"></script>
  <script th:if="${pageScript == 'personal-register'}" th:src="@{/js/personal-register.js}"></script>

</body>
</html>
