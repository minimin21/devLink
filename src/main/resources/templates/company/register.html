<div th:fragment="companyRegisterContent">

  <div th:if="${infoMessage}" class="alert alert-info alert-dismissible" role="alert">
    <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
    <span th:text="${infoMessage}">メッセージ</span>
  </div>

  <div class="panel panel-headline">
    <div class="panel-heading">
      <h3 class="panel-title">企業会員登録</h3>
      <p class="panel-subtitle">アカウント情報と企業情報を入力し、DevLink に企業として登録します。</p>
    </div>
    <div class="panel-body">

      <form th:action="@{/signup/company}" method="post" class="form-horizontal" enctype="multipart/form-data">

        <h4 class="heading" style="margin-top:0;">ログイン情報</h4>
        <div class="form-group">
          <label class="col-sm-2 control-label">ログインID</label>
          <div class="col-sm-6">
            <input type="text" name="loginId" class="form-control" placeholder="半角英数字（例: acme_corp）" maxlength="20" autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label class="col-sm-2 control-label">パスワード</label>
          <div class="col-sm-6">
            <input type="password" name="password" class="form-control" placeholder="8文字以上推奨" autocomplete="new-password">
          </div>
        </div>
        <div class="form-group">
          <label class="col-sm-2 control-label">パスワード確認</label>
          <div class="col-sm-6">
            <input type="password" name="passwordConfirm" class="form-control" placeholder="再入力" autocomplete="new-password">
          </div>
        </div>

        <div class="form-section-divider" role="separator" aria-label="ログイン情報と企業情報の区切り">
          <span class="form-section-label">企業情報入力</span>
        </div>

        <h4 class="heading" style="margin-top:0;">企業情報</h4>
        <div class="form-group">
          <label class="col-sm-2 control-label">企業ロゴ</label>
          <div class="col-sm-8">
            <div class="profile-photo-box">
              <div class="profile-photo-preview-wrap">
                <img id="companyLogoPreview" class="profile-photo-preview" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
              </div>
              <div class="profile-photo-actions">
                <div class="profile-photo-toolbar">
                  <label class="profile-photo-btn">
                    <i class="fa fa-upload" aria-hidden="true"></i> 画像を選択
                    <input type="file" id="companyLogoInput" name="logoImage" accept="image/jpeg,image/png,image/webp" style="position:absolute;width:.1px;height:.1px;opacity:0;overflow:hidden;z-index:-1;">
                  </label>
                  <button type="button" class="profile-photo-btn profile-photo-btn-secondary" id="companyLogoClear">
                    <i class="fa fa-times" aria-hidden="true"></i> 選択をクリア
                  </button>
                </div>
                <p class="profile-photo-hint">JPG / PNG / WebP、5MB以下を推奨。未設定の場合は後から登録できます。</p>
              </div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="col-sm-2 control-label">企業名</label>
          <div class="col-sm-6">
            <input type="text" name="companyName" class="form-control" placeholder="株式会社サンプル" maxlength="50">
          </div>
        </div>
        <div class="form-group">
          <label class="col-sm-2 control-label">事業者登録番号</label>
          <div class="col-sm-4">
            <input type="text" name="businessNumber" class="form-control" placeholder="123-45-67890" maxlength="15" autocomplete="off">
          </div>
        </div>
        <div class="form-group">
          <label class="col-sm-2 control-label">代表メール</label>
          <div class="col-sm-6">
            <input type="email" name="email" class="form-control" placeholder="contact@example.com" maxlength="255" autocomplete="email">
          </div>
        </div>
        <div class="form-group">
          <label class="col-sm-2 control-label">電話番号</label>
          <div class="col-sm-4">
            <input type="text" name="phoneNumber" class="form-control" placeholder="03-1234-5678" maxlength="13">
          </div>
        </div>
        <div class="form-group">
          <label class="col-sm-2 control-label">所在地</label>
          <div class="col-sm-8">
            <input type="text" name="address" class="form-control" placeholder="都道府県から入力">
          </div>
        </div>
        <div class="form-group">
          <label class="col-sm-2 control-label">企業サイトURL</label>
          <div class="col-sm-8">
            <input type="url" name="companyUrl" class="form-control" placeholder="https://example.com" maxlength="1024">
          </div>
        </div>
        <div class="form-group">
          <label class="col-sm-2 control-label">設立日</label>
          <div class="col-sm-4">
            <input type="date" name="foundedDate" class="form-control">
          </div>
        </div>
        <div class="form-group">
          <label class="col-sm-2 control-label">企業紹介</label>
          <div class="col-sm-8">
            <textarea name="introduction" class="form-control register-intro-textarea" rows="5" maxlength="2000" placeholder="事業内容・文化・採用方針など（10〜2000文字目安）"></textarea>
            <p class="profile-photo-hint" style="margin-top:6px;">掲載は審査の対象になる場合があります。</p>
          </div>
        </div>

        <div class="form-group">
          <div class="col-sm-offset-2 col-sm-8">
            <label class="fancy-checkbox">
              <input type="checkbox" name="agreeTerms" value="true"><span><i></i>利用規約およびプライバシーポリシーに同意する</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <div class="col-sm-offset-2 col-sm-8">
            <button type="submit" class="btn btn-primary">登録する</button>
            <a th:href="@{/signup}" class="btn btn-default" style="margin-left:8px;">戻る（会員種別選択）</a>
          </div>
        </div>

      </form>

    </div>
  </div>
</div>
