<!doctype html>
<html lang="ja">
<!--
  【プレビュー専用】企業会員登録（新規）画面の見本です。
  個人用: preview-personal-signup.html ／ 種別選択: preview-signup-type.html
  Spring/Thymeleaf には未接続。devLink/docs/ から相対パスで static を参照します。
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【プレビュー】企業会員登録 — DevLink</title>
  <link rel="stylesheet" href="../src/main/resources/static/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../src/main/resources/static/vendor/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="../src/main/resources/static/vendor/linearicons/style.css">
  <link rel="stylesheet" href="../src/main/resources/static/vendor/chartist/css/chartist-custom.css">
  <link rel="stylesheet" href="../src/main/resources/static/css/main.css">
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
  <style>
    .preview-banner {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 10px 15px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 13px;
    }
    .profile-photo-box {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 20px;
    }
    .profile-photo-preview-wrap { flex: 0 0 auto; }
    .profile-photo-preview {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #e8e8e8;
      background: #f5f5f5 url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="%23ccc"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>') center no-repeat;
      background-size: 40px 40px;
      display: block;
    }
    .profile-photo-preview.has-image { background-image: none; }
    .profile-photo-actions { flex: 1; min-width: 200px; }
    .profile-photo-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 10px;
    }
    .profile-photo-toolbar .profile-photo-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 16px;
      margin: 0;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #fff;
      color: #333;
      box-sizing: border-box;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }
    .profile-photo-toolbar label.profile-photo-btn { cursor: pointer; font-weight: 500; }
    .profile-photo-toolbar .profile-photo-btn:hover {
      background: #f5f5f5;
      border-color: #adadad;
    }
    .profile-photo-toolbar .profile-photo-btn-secondary { color: #555; }
    .profile-photo-toolbar .profile-photo-btn-secondary:hover {
      color: #a94442;
      border-color: #d4a4a4;
      background: #fdf7f7;
    }
    .profile-photo-toolbar .profile-photo-btn:focus,
    .profile-photo-toolbar label.profile-photo-btn:focus-within {
      outline: 2px solid rgba(51, 122, 183, 0.35);
      outline-offset: 2px;
    }
    .profile-photo-hint {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
    }
    .form-section-divider {
      margin: 40px 0 32px;
      border-top: 1px solid #e1e1e1;
      position: relative;
      height: 0;
    }
    .form-section-divider .form-section-label {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 0 16px;
      font-size: 12px;
      font-weight: 600;
      color: #999;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .register-intro-textarea {
      min-height: 120px;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <nav class="navbar navbar-default navbar-fixed-top">
      <div class="brand">
        <a href="#"><img src="../src/main/resources/static/img/devLink-logo.png" alt="DevLink" class="img-responsive logo"></a>
      </div>
      <div class="container-fluid">
        <div id="navbar-menu">
          <ul class="nav navbar-nav navbar-right">
            <li><a href="#"><i class="lnr lnr-power-switch"></i> <span>LOGIN</span></a></li>
          </ul>
        </div>
      </div>
    </nav>
    <div id="sidebar-nav" class="sidebar">
      <div class="sidebar-scroll">
        <nav>
          <ul class="nav">
            <li><a href="#"><i class="lnr lnr-home"></i> <span>ホーム</span></a></li>
            <li><a href="#"><i class="lnr lnr-magnifier"></i> <span>開発者検索</span></a></li>
            <li><a href="#"><i class="lnr lnr-bubble"></i> <span>コミュニティ</span></a></li>
          </ul>
        </nav>
      </div>
    </div>
    <div class="main">
      <div class="main-content">
        <div class="container-fluid">
          <div class="preview-banner">
            プレビュー専用（DB・コントローラ未接続）。本番では <code>templates/company/</code> のフラグメントを <code>layout.html</code> の <code>content</code> に載せます。
          </div>
          <div class="panel panel-headline">
            <div class="panel-heading">
              <h3 class="panel-title">企業会員登録</h3>
              <p class="panel-subtitle">アカウント情報と企業情報を入力し、DevLink に企業として登録します。</p>
            </div>
            <div class="panel-body">
              <form action="#" method="post" class="form-horizontal" enctype="multipart/form-data">
                <h4 class="heading" style="margin-top:0;">ログイン情報</h4>
                <div class="form-group">
                  <label class="col-sm-2 control-label">ログインID</label>
                  <div class="col-sm-6">
                    <input type="text" class="form-control" placeholder="半角英数字（例: acme_corp）" maxlength="20">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">パスワード</label>
                  <div class="col-sm-6">
                    <input type="password" class="form-control" placeholder="8文字以上推奨">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">パスワード確認</label>
                  <div class="col-sm-6">
                    <input type="password" class="form-control" placeholder="再入力">
                  </div>
                </div>
                <div class="form-section-divider" role="separator">
                  <span class="form-section-label">企業情報入力</span>
                </div>
                <h4 class="heading" style="margin-top:0;">企業情報</h4>
                <div class="form-group">
                  <label class="col-sm-2 control-label">企業ロゴ</label>
                  <div class="col-sm-8">
                    <div class="profile-photo-box">
                      <div class="profile-photo-preview-wrap">
                        <img id="companyLogoPreview" class="profile-photo-preview" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
                      </div>
                      <div class="profile-photo-actions">
                        <div class="profile-photo-toolbar">
                          <label class="profile-photo-btn">
                            <i class="fa fa-upload" aria-hidden="true"></i> 画像を選択
                            <input type="file" id="companyLogoInput" accept="image/jpeg,image/png,image/webp" style="position:absolute;width:.1px;height:.1px;opacity:0;overflow:hidden;z-index:-1;">
                          </label>
                          <button type="button" class="profile-photo-btn profile-photo-btn-secondary" id="companyLogoClear">
                            <i class="fa fa-times" aria-hidden="true"></i> 選択をクリア
                          </button>
                        </div>
                        <p class="profile-photo-hint">JPG / PNG / WebP、5MB以下を推奨。未設定の場合は後から登録できます。</p>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">企業名</label>
                  <div class="col-sm-6">
                    <input type="text" class="form-control" placeholder="株式会社サンプル" maxlength="50">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">事業者登録番号</label>
                  <div class="col-sm-4">
                    <input type="text" class="form-control" placeholder="123-45-67890" maxlength="15">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">代表メール</label>
                  <div class="col-sm-6">
                    <input type="email" class="form-control" placeholder="contact@example.com" maxlength="255">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">電話番号</label>
                  <div class="col-sm-4">
                    <input type="text" class="form-control" placeholder="03-1234-5678" maxlength="13">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">所在地</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control" placeholder="都道府県から入力">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">企業サイトURL</label>
                  <div class="col-sm-8">
                    <input type="url" class="form-control" placeholder="https://example.com" maxlength="1024">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">設立日</label>
                  <div class="col-sm-4">
                    <input type="date" class="form-control">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">企業紹介</label>
                  <div class="col-sm-8">
                    <textarea class="form-control register-intro-textarea" rows="5" maxlength="2000" placeholder="事業内容・文化・採用方針など（10〜2000文字目安）"></textarea>
                    <p class="profile-photo-hint" style="margin-top:6px;">掲載は審査の対象になる場合があります。</p>
                  </div>
                </div>
                <div class="form-group">
                  <div class="col-sm-offset-2 col-sm-8">
                    <label class="fancy-checkbox">
                      <input type="checkbox"><span><i></i>利用規約およびプライバシーポリシーに同意する</span>
                    </label>
                  </div>
                </div>
                <div class="form-group">
                  <div class="col-sm-offset-2 col-sm-8">
                    <button type="button" class="btn btn-primary" onclick="alert('プレビュー: 送信は未接続です');">登録する</button>
                    <a href="preview-signup-type.html" class="btn btn-default" style="margin-left:8px;">戻る（会員種別選択）</a>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <footer style="padding:20px 0; text-align:right; color:#888; font-size:12px;">© 2026 DevLink（プレビュー）</footer>
    </div>
  </div>
  <script src="../src/main/resources/static/vendor/jquery/jquery.min.js"></script>
  <script src="../src/main/resources/static/vendor/bootstrap/js/bootstrap.min.js"></script>
  <script src="../src/main/resources/static/vendor/jquery-slimscroll/jquery.slimscroll.min.js"></script>
  <script src="../src/main/resources/static/js/klorofil-common.js"></script>
  <script>
    (function () {
      var input = document.getElementById('companyLogoInput');
      var preview = document.getElementById('companyLogoPreview');
      var clearBtn = document.getElementById('companyLogoClear');
      if (!input || !preview || !clearBtn) return;
      var emptyGif = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
      input.addEventListener('change', function () {
        var file = input.files && input.files[0];
        if (file && file.size > 5 * 1024 * 1024) {
          alert('5MB を超えるファイルは選択できません。');
          input.value = '';
          return;
        }
        if (!file || !file.type.match(/^image\//)) return;
        var reader = new FileReader();
        reader.onload = function (e) {
          preview.src = e.target.result;
          preview.classList.add('has-image');
        };
        reader.readAsDataURL(file);
      });
      clearBtn.addEventListener('click', function () {
        input.value = '';
        preview.src = emptyGif;
        preview.classList.remove('has-image');
      });
    })();
  </script>
</body>
</html>
