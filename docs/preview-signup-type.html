<!doctype html>
<html lang="ja">
<!--
  【プレビュー専用】新規会員登録 — 個人 / 企業の選択画面。
  個人フォーム: preview-personal-signup.html ／ 企業フォーム: preview-company-signup.html
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【プレビュー】会員種別の選択 — DevLink</title>
  <link rel="stylesheet" href="../src/main/resources/static/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../src/main/resources/static/vendor/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="../src/main/resources/static/vendor/linearicons/style.css">
  <link rel="stylesheet" href="../src/main/resources/static/vendor/chartist/css/chartist-custom.css">
  <link rel="stylesheet" href="../src/main/resources/static/css/main.css">
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
  <style>
    .preview-banner {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 10px 15px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 13px;
    }
    .signup-type-card {
      display: block;
      padding: 28px 24px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      color: #333;
      background: #fafafa;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .signup-type-card:hover {
      border-color: #337ab7;
      background: #f5f9fc;
      text-decoration: none;
      color: #245682;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .signup-type-card .fa { font-size: 42px; margin-bottom: 12px; color: #5a5a5a; }
    .signup-type-card:hover .fa { color: #337ab7; }
    .signup-type-card h4 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    .signup-type-card p { margin: 0; font-size: 13px; color: #777; }
  </style>
</head>
<body>
  <div id="wrapper">
    <nav class="navbar navbar-default navbar-fixed-top">
      <div class="brand">
        <a href="#"><img src="../src/main/resources/static/img/devLink-logo.png" alt="DevLink" class="img-responsive logo"></a>
      </div>
      <div class="container-fluid">
        <div id="navbar-menu">
          <ul class="nav navbar-nav navbar-right">
            <li><a href="#"><i class="lnr lnr-power-switch"></i> <span>LOGIN</span></a></li>
          </ul>
        </div>
      </div>
    </nav>
    <div id="sidebar-nav" class="sidebar">
      <div class="sidebar-scroll">
        <nav><ul class="nav">
          <li><a href="#"><i class="lnr lnr-home"></i> <span>ホーム</span></a></li>
        </ul></nav>
      </div>
    </div>
    <div class="main">
      <div class="main-content">
        <div class="container-fluid">
          <div class="preview-banner">プレビュー専用。Spring には未接続です。</div>
          <div class="panel panel-headline">
            <div class="panel-heading">
              <h3 class="panel-title">新規会員登録</h3>
              <p class="panel-subtitle">登録する会員の種類を選んでください。</p>
            </div>
            <div class="panel-body">
              <div class="row">
                <div class="col-md-6" style="margin-bottom:20px;">
                  <a href="preview-personal-signup.html" class="signup-type-card">
                    <i class="fa fa-user" aria-hidden="true"></i>
                    <h4>個人会員</h4>
                    <p>開発者・フリーランスとして登録します。</p>
                  </a>
                </div>
                <div class="col-md-6" style="margin-bottom:20px;">
                  <a href="preview-company-signup.html" class="signup-type-card">
                    <i class="fa fa-building" aria-hidden="true"></i>
                    <h4>企業会員</h4>
                    <p>採用・案件募集のため企業として登録します。</p>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <footer style="padding:20px 0; text-align:right; color:#888; font-size:12px;">© 2026 DevLink（プレビュー）</footer>
    </div>
  </div>
  <script src="../src/main/resources/static/vendor/jquery/jquery.min.js"></script>
  <script src="../src/main/resources/static/vendor/bootstrap/js/bootstrap.min.js"></script>
  <script src="../src/main/resources/static/js/klorofil-common.js"></script>
</body>
</html>
