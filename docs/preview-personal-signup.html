<!doctype html>
<html lang="ja">
<!--
  【プレビュー専用】個人会員登録（新規）画面の見本です。
  Spring/Thymeleaf には未接続。ブラウザでこのファイルを開いてレイアウトのみ確認してください。
  開き方: エクスプローラーで本ファイルをダブルクリック、または Live Server で docs フォルダをルートにしないでください。
  推奨: 本ファイルの場所は devLink/docs/ です。CSS/JS は ../src/main/resources/static/ を参照します。
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【プレビュー】個人会員登録 — DevLink</title>
  <link rel="stylesheet" href="../src/main/resources/static/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../src/main/resources/static/vendor/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="../src/main/resources/static/vendor/linearicons/style.css">
  <link rel="stylesheet" href="../src/main/resources/static/vendor/chartist/css/chartist-custom.css">
  <link rel="stylesheet" href="../src/main/resources/static/css/main.css">
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
  <style>
    .preview-banner {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 10px 15px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 13px;
    }
    .profile-photo-box {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 20px;
    }
    .profile-photo-preview-wrap {
      flex: 0 0 auto;
    }
    .profile-photo-preview {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #e8e8e8;
      background: #f5f5f5 url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="%23ccc"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>') center no-repeat;
      background-size: 48px 48px;
      display: block;
    }
    .profile-photo-preview.has-image {
      background-image: none;
    }
    .profile-photo-actions {
      flex: 1;
      min-width: 200px;
    }
    .profile-photo-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 10px;
    }
    .profile-photo-toolbar .profile-photo-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 16px;
      margin: 0;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #fff;
      color: #333;
      vertical-align: middle;
      box-sizing: border-box;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }
    .profile-photo-toolbar label.profile-photo-btn {
      cursor: pointer;
      font-weight: 500;
    }
    .profile-photo-toolbar .profile-photo-btn:hover {
      background: #f5f5f5;
      border-color: #adadad;
    }
    .profile-photo-toolbar .profile-photo-btn-secondary {
      color: #555;
    }
    .profile-photo-toolbar .profile-photo-btn-secondary:hover {
      color: #a94442;
      border-color: #d4a4a4;
      background: #fdf7f7;
    }
    .profile-photo-toolbar .profile-photo-btn:focus,
    .profile-photo-toolbar label.profile-photo-btn:focus-within {
      outline: 2px solid rgba(51, 122, 183, 0.35);
      outline-offset: 2px;
    }
    .profile-photo-hint {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
    }
    .form-section-divider {
      margin: 40px 0 32px;
      border-top: 1px solid #e1e1e1;
      position: relative;
      height: 0;
    }
    .form-section-divider .form-section-label {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 0 16px;
      font-size: 12px;
      font-weight: 600;
      color: #999;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .gender-select {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      max-width: 420px;
    }
    .gender-option {
      position: relative;
      flex: 1;
      min-width: 130px;
      margin: 0;
      font-weight: normal;
      cursor: pointer;
    }
    .gender-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .gender-option-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 46px;
      padding: 10px 18px;
      border: 2px solid #dcdcdc;
      border-radius: 6px;
      background: #fafafa;
      font-size: 15px;
      font-weight: 500;
      color: #555;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    .gender-option-inner .fa {
      font-size: 18px;
      opacity: 0.85;
    }
    .gender-option:hover .gender-option-inner {
      border-color: #bbb;
      background: #f3f3f3;
    }
    .gender-option input:focus + .gender-option-inner {
      outline: 2px solid rgba(51, 122, 183, 0.45);
      outline-offset: 2px;
    }
    .gender-option input:checked + .gender-option-inner {
      border-color: #337ab7;
      background: #eef5fb;
      color: #245682;
      box-shadow: inset 0 0 0 1px rgba(51, 122, 183, 0.15);
    }
    .gender-option input:checked + .gender-option-inner .fa {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="wrapper">

    <!-- 本番では common/header :: header -->
    <nav class="navbar navbar-default navbar-fixed-top">
      <div class="brand">
        <a href="#"><img src="../src/main/resources/static/img/devLink-logo.png" alt="DevLink" class="img-responsive logo"></a>
      </div>
      <div class="container-fluid">
        <div id="navbar-menu">
          <ul class="nav navbar-nav navbar-right">
            <li><a href="#"><i class="lnr lnr-power-switch"></i> <span>LOGIN</span></a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- 本番では common/sidebar :: sidebar（静的に一部再現） -->
    <div id="sidebar-nav" class="sidebar">
      <div class="sidebar-scroll">
        <nav>
          <ul class="nav">
            <li><a href="#"><i class="lnr lnr-home"></i> <span>ホーム</span></a></li>
            <li><a href="#"><i class="lnr lnr-magnifier"></i> <span>開発者検索</span></a></li>
            <li><a href="#"><i class="lnr lnr-bubble"></i> <span>コミュニティ</span></a></li>
          </ul>
        </nav>
      </div>
    </div>

    <div class="main">
      <div class="main-content">
        <div class="container-fluid">

          <div class="preview-banner">
            プレビュー専用（DB・コントローラ未接続）。本番では <code>templates/personal/</code> のフラグメントを <code>layout.html</code> の <code>content</code> に載せます。
          </div>

          <!-- ここから実装イメージ: pages の代わりに personal 配下フラグメント相当 -->
          <div class="panel panel-headline">
            <div class="panel-heading">
              <h3 class="panel-title">個人会員登録</h3>
              <p class="panel-subtitle">アカウント情報を入力し、DevLink に個人として登録します。</p>
            </div>
            <div class="panel-body">

              <!-- 本番で画像アップロードする場合は enctype="multipart/form-data" を付与 -->
              <form action="#" method="post" class="form-horizontal" enctype="multipart/form-data">

                <h4 class="heading" style="margin-top:0;">ログイン情報</h4>
                <div class="form-group">
                  <label class="col-sm-2 control-label">ログインID</label>
                  <div class="col-sm-6">
                    <input type="text" class="form-control" placeholder="半角英数字（例: taro_dev）" maxlength="20">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">パスワード</label>
                  <div class="col-sm-6">
                    <input type="password" class="form-control" placeholder="8文字以上推奨">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">パスワード確認</label>
                  <div class="col-sm-6">
                    <input type="password" class="form-control" placeholder="再入力">
                  </div>
                </div>

                <div class="form-section-divider" role="separator" aria-label="ログイン情報とプロフィールの区切り">
                  <span class="form-section-label">プロフィール入力</span>
                </div>

                <h4 class="heading" style="margin-top:0;">プロフィール（個人）</h4>
                <div class="form-group">
                  <label class="col-sm-2 control-label">プロフィール写真</label>
                  <div class="col-sm-8">
                    <div class="profile-photo-box">
                      <div class="profile-photo-preview-wrap">
                        <img id="profilePhotoPreview" class="profile-photo-preview" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
                      </div>
                      <div class="profile-photo-actions">
                        <div class="profile-photo-toolbar">
                          <label class="profile-photo-btn">
                            <i class="fa fa-upload" aria-hidden="true"></i> 画像を選択
                            <input type="file" id="profilePhotoInput" name="profileImage" accept="image/jpeg,image/png,image/webp" style="position:absolute;width:.1px;height:.1px;opacity:0;overflow:hidden;z-index:-1;">
                          </label>
                          <button type="button" class="profile-photo-btn profile-photo-btn-secondary" id="profilePhotoClear">
                            <i class="fa fa-times" aria-hidden="true"></i> 選択をクリア
                          </button>
                        </div>
                        <p class="profile-photo-hint">JPG / PNG / WebP、5MB以下を推奨。正方形に近い画像がきれいに表示されます。</p>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">氏名</label>
                  <div class="col-sm-6">
                    <input type="text" class="form-control" placeholder="山田 太郎" maxlength="20">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">性別</label>
                  <div class="col-sm-8">
                    <div class="gender-select" role="radiogroup" aria-label="性別">
                      <label class="gender-option">
                        <input type="radio" name="gender" value="1" checked>
                        <span class="gender-option-inner"><i class="fa fa-male" aria-hidden="true"></i>男性</span>
                      </label>
                      <label class="gender-option">
                        <input type="radio" name="gender" value="2">
                        <span class="gender-option-inner"><i class="fa fa-female" aria-hidden="true"></i>女性</span>
                      </label>
                    </div>
                    <p class="profile-photo-hint" style="margin-top:10px;margin-bottom:0;">いずれか一方を選択してください。</p>
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">生年月日</label>
                  <div class="col-sm-4">
                    <input type="date" class="form-control">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">メール</label>
                  <div class="col-sm-6">
                    <input type="email" class="form-control" placeholder="example@email.com" maxlength="255">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">電話番号</label>
                  <div class="col-sm-4">
                    <input type="text" class="form-control" placeholder="090-1234-5678" maxlength="13">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-2 control-label">住所</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control" placeholder="都道府県から入力">
                  </div>
                </div>

                <div class="form-group">
                  <div class="col-sm-offset-2 col-sm-8">
                    <label class="fancy-checkbox">
                      <input type="checkbox"><span><i></i>利用規約およびプライバシーポリシーに同意する</span>
                    </label>
                  </div>
                </div>

                <div class="form-group">
                  <div class="col-sm-offset-2 col-sm-8">
                    <button type="button" class="btn btn-primary" onclick="alert('プレビュー: 送信は未接続です');">登録する</button>
                    <a href="#" class="btn btn-default" style="margin-left:8px;">戻る（会員種別選択）</a>
                  </div>
                </div>

              </form>

            </div>
          </div>

        </div>
      </div>

      <footer style="padding:20px 0; text-align:right; color:#888; font-size:12px;">
        © 2026 DevLink（プレビュー）
      </footer>
    </div>
  </div>

  <script src="../src/main/resources/static/vendor/jquery/jquery.min.js"></script>
  <script src="../src/main/resources/static/vendor/bootstrap/js/bootstrap.min.js"></script>
  <script src="../src/main/resources/static/vendor/jquery-slimscroll/jquery.slimscroll.min.js"></script>
  <script src="../src/main/resources/static/js/klorofil-common.js"></script>
  <script>
    (function () {
      var input = document.getElementById('profilePhotoInput');
      var preview = document.getElementById('profilePhotoPreview');
      var clearBtn = document.getElementById('profilePhotoClear');
      if (!input || !preview) return;

      function setPreviewFromFile(file) {
        if (!file || !file.type.match(/^image\//)) return;
        var reader = new FileReader();
        reader.onload = function (e) {
          preview.src = e.target.result;
          preview.classList.add('has-image');
        };
        reader.readAsDataURL(file);
      }

      input.addEventListener('change', function () {
        var file = input.files && input.files[0];
        if (file && file.size > 5 * 1024 * 1024) {
          alert('プレビュー: 5MB を超えるファイルは選べません（本番ではサーバ側でも検証してください）。');
          input.value = '';
          return;
        }
        setPreviewFromFile(file);
      });

      clearBtn.addEventListener('click', function () {
        input.value = '';
        preview.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
        preview.classList.remove('has-image');
      });
    })();
  </script>
</body>
</html>
